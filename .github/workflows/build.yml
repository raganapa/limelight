name: build

# Builds Limelight.exe and Limelight-Setup.exe on every push, tests them on Windows,
# and attaches them to a GitHub release:
#   * automatically when you publish a release (Releases -> Draft a new release), or
#   * for a release that already exists: Actions -> build -> Run workflow -> enter its tag.

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the .exe files to this existing release (for example v1.0.4)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Windows cross-compiler and NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix nsis

      - name: Build Limelight.exe, Limelight-Setup.exe and the tests
        run: bash build.sh test

      # Everything goes into one flat folder, so the files sit at the top of the artifact.
      - name: Collect the files
        run: |
          mkdir -p out
          cp dist/Limelight.exe dist/Limelight-Setup.exe build/test_presenter.exe build/test_diag.exe out/

      - uses: actions/upload-artifact@v4
        with:
          name: Limelight
          path: out/

  test-on-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Limelight

      - name: HID++ logic against the simulated remote
        run: |
          .\test_presenter.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_presenter.exe receiver
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_presenter.exe quirky
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Hard press finder against the simulated remote
        run: |
          "3`n`n6`n" | .\test_diag.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "3`n`n6`n" | .\test_diag.exe alt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Informational: a runner without a real desktop must not block a release.
      - name: Smoke test (shows the spotlight for 5 seconds, then quits)
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath .\Limelight.exe -ArgumentList '--background','--demo=spotlight' -PassThru
          Start-Sleep -Seconds 9
          Start-Process -FilePath .\Limelight.exe -ArgumentList '--quit' -Wait
          Start-Sleep -Seconds 1
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
          $log = Get-Content "$env:LOCALAPPDATA\Limelight\limelight.log"
          $log
          if (-not ($log -match 'overlay: \d+ frames')) { Write-Error 'no frames were rendered'; exit 1 }

  attach-to-release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: [build, test-on-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Limelight

      - name: Attach Limelight-Setup.exe and Limelight.exe
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" Limelight-Setup.exe Limelight.exe --clobber --repo "$GITHUB_REPOSITORY"
